# Hardware classes and the model lineup each one gets.
# `uv run scripts/stack.py doctor --write-profile` detects RAM/VRAM and picks a class;
# the per-machine file (machines/<HOSTNAME>.yaml) can override any value here.
# Verify tags with `ollama pull` before adding new models: sizes below were read from
# ollama.com on 2026-10-24.

schema_version: 1

model_catalog:
  # id -> ollama tag, approx download size, role notes
  qwen2.5-coder:1.5b-base: {size_gb: 1.0,  role: fim,       notes: "Apache-2.0 FIM/autocomplete; always resident (~1.3 GB VRAM)"}
  nomic-embed-text:        {size_gb: 0.3,  role: embed,     notes: "local embeddings for RAG/eval similarity"}
  qwen3.5:9b:              {size_gb: 6.6,  role: small,     notes: "dense 9B, fits 12 GB fully at 16k ctx with q8_0 KV; tools+thinking"}
  qwen3.6:35b-a3b-coding:  {size_gb: 23,   role: primary,   notes: "MoE 35B/3B-active coding tune; experts offloaded to RAM by llama.cpp fit; needs >=28 GB RAM"}
  qwen3.6:35b-a3b:         {size_gb: 23,   role: primary,   notes: "general MoE sibling of the coding tune"}
  flint:40b-a2b:           {size_gb: 23,   role: reviewer,  notes: "Apache-2.0 MoE 40B/2.5B-active (Recursive); vendor SWE-bench Verified 74.2; second-opinion reviewer"}
  gpt-oss:20b:             {size_gb: 13,   role: reviewer,  notes: "different-family reviewer; spills ~1-2 GB to CPU on 12 GB"}

hardware_classes:
  # evaluated top-down; first match wins
  - name: big-vram
    when: {vram_mib_min: 20000}
    models: {fim: qwen2.5-coder:1.5b-base, embed: nomic-embed-text, small: qwen3.5:9b, primary: qwen3.6:35b-a3b-coding, reviewer: flint:40b-a2b}
    primary_num_ctx: 65536
    small_num_ctx: 32768
    max_loaded_models: 2
  - name: moe-12gb-32ram
    when: {vram_mib_min: 10000, ram_gb_min: 28}
    models: {fim: qwen2.5-coder:1.5b-base, embed: nomic-embed-text, small: qwen3.5:9b, primary: qwen3.6:35b-a3b-coding, reviewer: flint:40b-a2b}
    primary_num_ctx: 32768
    small_num_ctx: 16384
    max_loaded_models: 2
    # Ollama turns mmap off by default on Windows+CUDA, which copies the ~12.6 GB of CPU-side expert weights into
    # anonymous memory. With desktop apps open that forces paging and the load times out. Keep them file-backed.
    primary_options: {use_mmap: true}
    reviewer_options: {use_mmap: true}
  - name: dense-12gb-16ram
    when: {vram_mib_min: 10000}
    models: {fim: qwen2.5-coder:1.5b-base, embed: nomic-embed-text, small: qwen3.5:9b, primary: qwen3.5:9b, reviewer: null}
    primary_num_ctx: 16384
    small_num_ctx: 16384
    max_loaded_models: 2
  - name: small-gpu
    when: {vram_mib_min: 6000}
    models: {fim: qwen2.5-coder:1.5b-base, embed: nomic-embed-text, small: qwen3.5:9b, primary: qwen3.5:9b, reviewer: null}
    primary_num_ctx: 8192
    small_num_ctx: 8192
    max_loaded_models: 1
  - name: cloud-first
    when: {}
    models: {fim: qwen2.5-coder:1.5b-base, embed: nomic-embed-text, small: null, primary: null, reviewer: null}
    primary_num_ctx: 0
    small_num_ctx: 0
    max_loaded_models: 1

ollama_env:
  # Applied as Windows USER environment variables (or printed for systemd) by `stack.py setup`.
  # Values marked {auto} are derived from the hardware class.
  OLLAMA_FLASH_ATTENTION: "1"
  OLLAMA_KV_CACHE_TYPE: "q8_0"
  OLLAMA_NUM_PARALLEL: "1"
  OLLAMA_MAX_LOADED_MODELS: "{auto}"
  OLLAMA_MAX_QUEUE: "32"
  OLLAMA_CONTEXT_LENGTH: "{auto}"
  OLLAMA_KEEP_ALIVE: "4h"     # the gateway sends no keep_alive for chat models, so this governs them; the tray warms the primary at start
  OLLAMA_GPU_OVERHEAD: "536870912"
  OLLAMA_LOAD_TIMEOUT: "15m"   # default 5m is too short for a 22 GB MoE read from a USB SSD under memory pressure
  # LLAMA_ARG_N_CPU_MOE: "24"   # optional manual expert-offload override passed through to llama-server (see bench)

ports:
  ollama: 11434
  litellm: 4000
  phoenix: 6006
  phoenix_grpc: 4317
  orchestrator: 8765
  open_webui: 3000
  comfyui: 8188     # image, video and music generation (media)
  kokoro: 8880      # text to speech, OpenAI-compatible /v1/audio/speech
  dictation: 8790   # voice typing app: local control endpoint (health, toggle) for the tray

services:
  # native = run as a local process via `stack.py up`; docker = infrastructure/docker-compose.yml; off = not managed
  ollama: native
  litellm: native
  phoenix: native
  orchestrator: native
  open_webui: native
  comfyui: 'off'    # native once media.root is set and `stack.py setup` installed it
  kokoro: 'off'     # native once `stack.py setup` installed Kokoro-FastAPI under media.root
  dictation: 'off'  # voice typing (Whisper, any app); native once `stack.py dictate install` built its environment

media:
  # Image, video, music and speech tools (docs/design/plans/2026-11-01-multimodal-stack.md). Set `root` per machine,
  # inside agent_access.allowed_roots; ComfyUI, its models, inputs, outputs and the uv cache go below it.
  root: ''
  hf_home: ''                # HF_HOME for media downloads; '' keeps the user's own HF_HOME
  comfyui_ref: master        # git ref `setup` checks out; pin a commit for repeatable installs
  torch_index: https://download.pytorch.org/whl/cu130   # CUDA 13 wheels; drivers 580+ (cpu: .../whl/cpu)
  # --lowvram and --reserve-vram keep ComfyUI working while the chat model holds most of the card (plan G2).
  comfyui_args: [--lowvram, --reserve-vram, '1.0']
  image_workflow: z_image_turbo   # config/comfyui/workflows/<name>.json
  image_size: 1024x1024
  image_steps: 8

dictation:
  # Voice typing in any app (scripts/stacklib/dictation; docs/manuals/user-guide.md "Voice typing"). A floating mic
  # button and a hotkey record the microphone; Whisper (faster-whisper) transcribes on this machine; the cleanup uses a
  # private gateway alias. Audio stays in memory. The button's right-click menu changes mode, style, language and insert.
  hotkey: ctrl+alt+d         # tap: listen until you stop talking; hold: talk while held. Esc cancels. (Ctrl+Alt+Space
                             # is the Claude desktop app's quick entry)
  mode: polish               # polish: type when you finish, cleaned up | live: type each phrase when you pause
  style: clean               # polish cleanup: verbatim | clean (fillers, false starts, punctuation) | concise (also shorter)
  language: auto             # auto, or a Whisper language code: en, th, ja, ...
  model: large-v3-turbo      # faster-whisper model on the GPU (1.6 GB, cached in HF_HOME)
  cpu_model: small           # used when the GPU is not available (turbo needs ~10 s per 15 s of speech on a 6-core CPU)
  device: auto               # auto (GPU when it works) | cuda | cpu
  compute_type: auto         # int8_float16 on the GPU, int8 on the CPU
  silence_stop_s: 3.0        # stop after this much quiet once you have spoken
  start_timeout_s: 8.0       # stop if you say nothing at all
  phrase_pause_s: 0.7        # a pause this long ends a phrase (live mode types it)
  max_minutes: 10            # hard limit per recording
  insert: paste              # paste (clipboard restored afterwards) | type (simulated keystrokes)
  cleanup_model: local-small # gateway alias for the cleanup (private models only)
  vocabulary: ''             # words Whisper should expect, e.g. 'Logseq, LiteLLM, Ollama, Qwen'
  mic: ''                    # '' = the Windows default input; else part of the device name
  unload_after_min: 30       # free Whisper's VRAM after this many idle minutes (0 = never)
  button: true               # show the floating button (the hotkey works either way)
  env_dir: ''                # '' = <media.root>\dictation, or .run\dictation without a media root

agent_access:
  # Folders agent sessions and media tools may use (decision D-M6). Empty means "ask the owner": every media path
  # is refused until the machine file lists it.
  allowed_roots: []

observability:
  phoenix: true          # LiteLLM -> OTLP/HTTP -> Phoenix
  jsonl_traces: true     # LiteLLM custom callback -> traces/litellm/*.jsonl
  model_label: true      # chat replies end with the model that answered (and the image model after an image)
  gpu_exporter: false    # winget install utkuozdemir.nvidia_gpu_exporter (Prometheus :9835)

# External models (off by default) and data classes: policy/privacy.yaml.

claude_code:
  # Profile A (default): Claude Code talks to Anthropic directly on the subscription (outside the privacy boundary).
  # Profile B (`scripts/claude-local.ps1|sh`): CLAUDE_CONFIG_DIR=~/.claude-local -> LiteLLM /v1/messages.
  local_profile_dir: ~/.claude-local
  local_profile:
    default_model: local-primary
    haiku_model: local-small
    sonnet_model: local-primary
    opus_model: local-primary      # private aliases only; the build refuses anything else
    max_output_tokens: 8192

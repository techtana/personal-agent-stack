[project]
name = "personal-agent-stack"
version = "0.2.0"
description = "Local-first coding-agent stack: Ollama + LiteLLM + Claude Code, department agents from one source of truth"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastmcp==4.1.3",
    "pystray>=0.19",
    "pillow>=10",
    "psutil>=5.9",
]

[tool.uv]
# Prefer an installed python.org Python (signed by the Python Software Foundation) over uv's own builds, which are
# unsigned: Smart App Control refused the unsigned .venv\Scripts\pythonw.exe that starts the installer and the tray
# (CodeIntegrity 3033, 2026-11-01). Without a system Python uv still downloads its own.
python-preference = "system"
# The gateway, tracing UI and chat UI are installed as isolated uv tools by
# `uv run scripts/stack.py setup`, not as project dependencies, because they pin
# conflicting transitive versions:
#   uv tool install --python 3.12 "litellm[proxy]==1.106.3"
#   uv tool install --python 3.12 arize-phoenix
#   uv tool install --python 3.11 open-webui
